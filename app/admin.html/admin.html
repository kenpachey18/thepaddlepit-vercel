<body>
  <section class="login-shell" id="login-view"><form class="login-card" id="login-form"><div class="brand"><img src="/paddle-pit-logo.png" alt="The Paddle Pit"><span>THE PADDLE PIT<br>ADMIN</span></div><h1>Court control.</h1><p>Secure access for booking approvals, court availability, pricing, and venue operations.</p><div class="field"><label for="login-user">Email</label><input id="login-user" type="email" autocomplete="username" required></div><div class="field"><label for="login-pass">Password</label><input id="login-pass" type="password" autocomplete="current-password" required></div><div class="error" id="login-error"></div><button class="primary wide">Sign in</button><p><a href="/" style="color:var(--orange)">← Back to customer site</a></p></form></section>
  <section class="app hidden" id="admin-app"><header class="topbar"><div class="brand"><img src="/paddle-pit-logo.png" alt="" aria-hidden="true"><span>THE PADDLE PIT ADMIN</span></div><div class="topbar-actions"><a href="/">Back to customer site</a><button class="danger" id="logout">Log out</button></div></header><div class="admin-grid"><nav class="sidebar" id="admin-nav"><button data-view="overview" class="active">Overview</button><button data-view="pending">Pending</button><button data-view="confirmed">Confirmed</button><button data-view="completed">Completed</button><button data-view="availability">Court availability</button><button data-view="settings">Pricing & security</button><button data-view="audit">Audit history</button></nav><main class="main"><label class="mobile-view-switcher"><span>Admin section</span><select id="mobile-view-select"><option value="overview">Overview</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="availability">Court availability</option><option value="settings">Pricing and security</option><option value="audit">Audit history</option></select></label><div class="page-head"><small>Venue operations</small><h1 id="view-title">Today at the court.</h1></div><div id="view-content"></div></main></div></section>
  <div class="modal hidden" id="reschedule-modal" role="dialog" aria-modal="true" aria-labelledby="reschedule-title"><div class="modal-card reschedule-card" id="reschedule-content"></div></div>
  <div class="modal hidden" id="manual-booking-modal" role="dialog" aria-modal="true" aria-labelledby="manual-booking-title"><div class="modal-card manual-booking-card" id="manual-booking-content"></div></div>
  <script>
  (()=>{
    const $=selector=>document.querySelector(selector),money=value=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:0}).format(Number(value||0)),dateTime=value=>value?new Date(value).toLocaleString('en-PH',{timeZone:'Asia/Manila',dateStyle:'medium',timeStyle:'short'}):'Not set',hour=value=>{const n=Number(value)%24,s=n>=12?'PM':'AM';return`${n%12||12}:00 ${s}`},escape=value=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    const api=async(url,options={})=>{const response=await fetch(url,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({error:'Unexpected server response.'}));if(!response.ok)throw new Error(data.error||'Request failed.');if(options.method&&options.method.toUpperCase()!=='GET')invalidateAdminData();return data};

    function warmAdminData(){setTimeout(()=>{['/api/admin?view=overview','/api/admin?view=bookings&status=pending','/api/admin?view=bookings&status=confirmed','/api/admin?view=settings',`/api/admin?view=availability&start=${todayKey()}&count=3`].forEach(url=>adminGet(url).catch(()=>{}))},250)}

    $('#login-form').addEventListener('submit',async event=>{event.preventDefault();$('#login-error').textContent='';try{await api('/api/admin/auth',{method:'POST',body:JSON.stringify({action:'login',username:$('#login-user').value,password:$('#login-pass').value})});$('#login-view').classList.add('hidden');$('#admin-app').classList.remove('hidden');loadView('overview');warmAdminData()}catch(error){$('#login-error').textContent=error.message}});

    async function loadView(view){const version=++viewLoadVersion;currentView=view;mobileViewSelect.value=view;document.querySelectorAll('#admin-nav button').forEach(button=>button.classList.toggle('active',button.dataset.view===view));$('#view-title').textContent=titles[view];if(view==='availability'){const url=`/api/admin?view=availability&start=${availabilityStart}&count=3`,cached=adminDataCache.get(url);if(!cached)$('#view-content').innerHTML='<div class="panel empty">Loading…</div>';return renderAvailability()}const url=view==='overview'?'/api/admin?view=overview':['pending','confirmed','completed'].includes(view)?`/api/admin?view=bookings&status=${view}`:view==='settings'?'/api/admin?view=settings':'/api/admin?view=audit',cached=adminDataCache.get(url);if(cached)renderViewData(view,cached.data);else $('#view-content').innerHTML='<div class="panel empty">Loading…</div>';try{const data=await adminGet(url,{force:Boolean(cached)});if(version!==viewLoadVersion||view!==currentView)return;renderViewData(view,data)}catch(error){if(version!==viewLoadVersion||view!==currentView)return;if(cached)toast('Fresh admin data could not be loaded. Showing the latest saved view.');else $('#view-content').innerHTML=`<div class="panel error">${escape(error.message)}</div>`}}
    function renderOverview(data){const s=data.stats,today=new Date().toLocaleDateString('en-PH',{timeZone:'Asia/Manila',weekday:'long',month:'long',day:'numeric'});$('#view-content').innerHTML=`<div class="stats overview-stats"><div class="stat stat-accent"><span>Today's pending</span><strong>${s.todayPending}</strong></div><div class="stat stat-dark"><span>Today's confirmed</span><strong>${s.todayConfirmed}</strong></div><div class="stat"><span>All pending</span><strong>${s.totalPending}</strong></div><div class="stat"><span>Hourly rate</span><strong>${money(s.hourlyRate)}</strong></div><div class="stat stat-accent"><span>Expected today</span><strong>${money(s.todayRevenue)}</strong></div></div><div class="panel overview-panel"><div class="overview-panel-head"><h2>Today's schedule</h2><span>${escape(today)}</span></div>${scheduleTable(data.schedule)}</div>`}
    function scheduleTable(rows){if(!rows.length)return'<div class="empty">No customer bookings scheduled today.</div>';return`<div class="table-wrap"><table class="data-table mobile-data-table overview-schedule-table"><thead><tr><th>Status</th><th>Customer</th><th>Mobile</th><th>Time</th><th>Duration</th><th>Total</th><th>Payment</th><th>Submitted</th></tr></thead><tbody>${rows.map(row=>`<tr><td><span class="status status-${row.status}">${row.status}</span></td><td>${escape(row.full_name)}<br><a href="${escape(row.facebook_url)}" target="_blank" rel="noopener">Facebook</a></td><td>${escape(row.mobile)}</td><td>${hour(row.start_hour)} to ${hour(row.end_hour)}</td><td>${row.duration_hours} hr</td><td>${money(row.estimated_total)}</td><td>${escape(row.payment_status)}</td><td>${dateTime(row.submitted_at)}</td></tr>`).join('')}</tbody></table></div>`}

terms').checked,error=$('#manual-details-error');error.textContent='';if(!fullName)return error.textContent='Full name is required.';if(!/^09\d{9}$/.test(mobile))return error.textContent='Enter an 11-digit mobile number beginning with 09.';try{const url=new URL(facebookUrl);if(!/(^|\.)facebook\.com$|(^|\.)fb\.com$/i.test(url.hostname))throw new Error()}catch{return error.textContent='Enter a valid Facebook profile URL.'}if(!termsAccepted)return error.textContent='Confirm that the customer was informed of the booking terms.';state.customer={fullName,mobile,facebookUrl,termsAccepted};renderManualReview()})}
    function manualSummaryLine(label,value,total=false){return`<div class="${total?'total':''}"><span>${escape(label)}</span><strong>${value}</strong></div>`}
    function renderManualReview(){const state=manualBookingState;if(!state?.customer)return;const startHour=state.selectedHours[0],endHour=state.selectedHours.at(-1)+1,count=state.selectedHours.length;manualBookingContent.innerHTML=`${manualHeader('Step 3 of 3','Review manual booking.')}${manualProgress(3)}<div class="manual-booking-body"><p>This booking will be confirmed immediately and will appear in Confirmed bookings.</p><div class="manual-summary">${manualSummaryLine('Customer',escape(state.customer.fullName))}${manualSummaryLine('Mobile',escape(state.customer.mobile))}${manualSummaryLine('Facebook',`<a href="${escape(state.customer.facebookUrl)}" target="_blank" rel="noopener">View profile</a>`)}${manualSummaryLine('Booking date',escape(displayDay(state.selectedDate)))}${manualSummaryLine('Time',`${hour(startHour)} to ${hour(endHour)}`)}${manualSummaryLine('Duration',`${count} hour${count===1?'':'s'}`)}${manualSummaryLine('Hourly rate',money(state.rate))}${manualSummaryLine('Estimated total',money(state.rate*count),true)}${manualSummaryLine('Payment','At the venue after playing')}</div><div class="error" id="manual-submit-error"></div><div class="manual-actions"><button class="secondary" id="manual-back-details" type="button">← Edit details</button><button class="primary" id="manual-submit" type="button">Create confirmed booking →</button></div></div>`;bindManualClose();$('#manual-back-details').addEventListener('click',renderManualDetails);$('#manual-submit').addEventListener('click',submitManualBooking)}
    async function submitManualBooking(){const state=manualBookingState,button=$('#manual-submit'),error=$('#manual-submit-error');if(!state||!button)return;button.disabled=true;button.textContent='Creating booking...';error.textContent='';try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'manual_booking',...state.customer,bookingDate:state.selectedDate,hours:state.selectedHours})});manualBookingContent.innerHTML=`${manualHeader('Booking confirmed','Manual booking created.')}<div class="manual-success"><span class="manual-success-mark">✓</span><h3>Court time secured.</h3><p>The booking is confirmed and now appears in the court calendar and Confirmed bookings.</p><button class="primary" id="manual-done" type="button">Done</button></div>`;bindManualClose();$('#manual-done').addEventListener('click',async()=>{closeManualBooking();toast('Manual booking confirmed.');await renderAvailability(availabilityStart)})}catch(failure){error.textContent=failure.message;button.disabled=false;button.textContent='Create confirmed booking →'}}
    manualBookingModal.addEventListener('click',event=>{if(event.target===manualBookingModal)closeManualBooking()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!manualBookingModal.classList.contains('hidden'))closeManualBooking()});
    function renderSettings(data){$('#view-content').innerHTML=`<div class="settings-grid"><form class="panel" id="rate-form"><h2>Hourly rate</h2><p>New customer bookings use the latest rate. Existing bookings keep their submitted rate.</p><div class="field"><label for="rate">Philippine pesos per hour</label><input id="rate" type="number" min="1" step="1" value="${data.hourlyRate}" required></div><button class="primary">Save rate</button></form><form class="panel" id="password-form"><h2>Change password</h2><div class="field"><label for="current-pass">Current password</label><input id="current-pass" type="password" required></div><div class="field"><label for="new-pass">New password</label><input id="new-pass" type="password" minlength="8" required></div><div class="field"><label for="confirm-pass">Confirm new password</label><input id="confirm-pass" type="password" minlength="8" required></div><button class="secondary">Change password</button></form></div>`;$('#rate-form').addEventListener('submit',saveRate);$('#password-form').addEventListener('submit',changePassword)}
    async function saveRate(event){event.preventDefault();try{const data=await api('/api/admin',{method:'POST',body:JSON.stringify({action:'rate',rate:$('#rate').value})});toast(`Rate updated to ${money(data.hourlyRate)}.`)}catch(error){toast(error.message)}}
    async function changePassword(event){event.preventDefault();try{await api('/api/admin/auth',{method:'POST',body:JSON.stringify({action:'change_password',currentPassword:$('#current-pass').value,newPassword:$('#new-pass').value,confirmPassword:$('#confirm-pass').value})});alert('Password changed. Please sign in again.');location.reload()}catch(error){toast(error.message)}}
    function renderAudit(data){const rows=data.daily,summary=data.summary,month=dateFromKey(data.period.start).toLocaleDateString('en-PH',{month:'long',year:'numeric'});$('#view-content').innerHTML=`<div class="panel"><div class="overview-panel-head"><div><h2>${escape(month)} activity</h2><span>${escape(data.period.start)} to ${escape(data.period.end)} · resets every new month</span></div><span>30-day audit retention</span></div>${rows.length?`<div class="table-wrap"><table class="data-table mobile-data-table audit-table"><thead><tr><th>Date</th><th>Total bookings</th><th>Pending</th><th>Confirmed</th><th>Completed</th><th>Cancelled</th><th>Daily revenue</th></tr></thead><tbody>${rows.map(row=>`<tr><td><strong>${escape(dateFromKey(row.date).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'}))}</strong></td><td>${row.totalBookings}</td><td>${row.pendingBookings}</td><td>${row.confirmedBookings}</td><td>${row.completedBookings}</td><td>${row.cancelledBookings}</td><td class="audit-revenue">${money(row.revenue)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No bookings have been recorded this month.</div>'}</div><section class="panel month-summary"><div class="overview-panel-head"><div><span>Full month summary</span><h2>${escape(month)}</h2></div><span>First day through last day</span></div><div class="month-summary-grid"><div><span>Total bookings</span><strong>${summary.totalBookings}</strong></div><div><span>Pending</span><strong>${summary.pendingBookings}</strong></div><div><span>Confirmed</span><strong>${summary.confirmedBookings}</strong></div><div><span>Completed</span><strong>${summary.completedBookings}</strong></div><div><span>Cancelled</span><strong>${summary.cancelledBookings}</strong></div><div class="month-revenue"><span>Month revenue</span><strong>${money(summary.monthRevenue)}</strong></div></div></section>`}
    session();
  })();
  </script>
</body></html>
